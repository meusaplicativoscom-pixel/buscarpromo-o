

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca de Promoções</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  margin: 20px 10px;
}

/* GRID RESPONSIVO */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  padding: 15px;
}

/* CARDS */
.mercado {
  background: white;
  padding: 15px;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.mercado:active {
  transform: scale(0.97);
}

.mercado img {
  width: 80px;
}

/* CATEGORIAS */
.categorias {
  display: none;
  padding-bottom: 15px;
}

.categorias a {
  display: block;
  margin: 8px auto;
  padding: 12px;
  width: 90%;
  max-width: 320px;
  background: white;
  border-radius: 8px;
  text-decoration: none;
  color: black;
  border: 1px solid #ddd;
  font-size: 16px;
}

.categorias a:active {
  background: #eee;
}

/* BOTÃO INSTALL */
#btnInstall {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  font-size: 16px;
  border: none;
  border-radius: 20px;
  background: black;
  color: white;
  display: none;
}
</style>
</head>

<body>

<h1>🔍 Buscar Promoções</h1>

<div class="container">

  <!-- NORDESTÃO -->
  <div class="mercado" onclick="toggleCategorias('nordestao')">
    <img src="https://play-lh.googleusercontent.com/QFcbFn0DW7TXWg6FIwYDmmNseQ6aHIUgaJhK6Lg_vK-2EbUxqTPEdITSa85zm2vg7kI">
    <p>Nordestão</p>
  </div>

  <!-- BOMDIA -->
  <div class="mercado" onclick="toggleCategorias('bomdia')">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSciX1Lg1P8q_pek2G4naoB0hFEXuKaoYqBMQ&s">
    <p>Bomdia</p>
  </div>

   <!-- Super show -->
  <div class="mercado" onclick="toggleCategorias('Super show')">
    <img src="https://th.bing.com/th/id/OIP.63H1DpHzxtrVGNFGzapWegAAAA?w=205&h=103&c=7&r=0&o=7&pid=1.7&rm=3">
    <p>Super show</p>
  </div>

  <!-- Assaí -->
  <div class="mercado" onclick="toggleCategorias('Assaí')">
    <img src="https://images.seeklogo.com/logo-png/25/2/assai-atacadista-logo-png_seeklogo-255596.png">
    <p>Assaí</p>
  </div>

  <!-- ATACADÃO -->
  <div class="mercado" onclick="toggleCategorias('atacadao')">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTFuhiISP1Db8A7nyun18110ezxIvca2__6uQ&s">
    <p>Atacadão</p>
  </div>

   <!-- Super 4 RN -->
  <div class="mercado" onclick="toggleCategorias('Super 4 RN')">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf3zM0WKuHF7pc0b3ICteD-57jOnS52zRQMw&s">
    <p>Super 4 RN</p>
  </div>

</div>

<!-- CATEGORIAS NORDESTÃO -->
<div id="nordestao" class="categorias">

<a href="https://www.lojaonline.nordestao.com.br/" target="_blank"> Ofertas 🛒 Nordestão</a>

</div>

<!-- BOMDIA -->
<div id="bomdia" class="categorias">
<a href="https://www.bomdiasupermercado.com.br/#/Ofertas" target="_blank"> Ofertas 🛒 Bom dia</a>
</div>

<!-- Super show -->
<div id="Super show" class="categorias">
<a href="https://redesupershow.com.br/encarte/" target="_blank"> Ofertas 🛒 Super Show</a>
</div>

<!-- Assaí -->
<div id="Assaí" class="categorias">
<a href="https://www.assai.com.br/ofertas/rio-grande-do-norte/assai-natal" target="_blank">Ofertas 🛒 Assaí</a>
</div>

<!-- ATACADÃO -->
<div id="atacadao" class="categorias">

<a href="https://www.atacadao.com.br/catalogo" target="_blank"> Ofertas 🛒 Atacadão</a>
</div>

<!-- Super 4 RN -->
<div id="Super 4 RN" class="categorias">

<a href="https://www.instagram.com/super4alecrim/p/DWV_AzQDsCK/" target="_blank"> Ofertas 🛒 Super 4</a>
</div>

<button id="btnInstall">📲 Instalar App</button>

<script>
function toggleCategorias(id) {
  let div = document.getElementById(id);

  document.querySelectorAll(".categorias").forEach(el => {
    if (el.id !== id) el.style.display = "none";
  });

  div.style.display = div.style.display === "block" ? "none" : "block";
}

// PWA
let deferredPrompt;
const btnInstall = document.getElementById("btnInstall");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = "block";
});

btnInstall.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btnInstall.style.display = "none";
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
